  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: shifthelper_session
      description: 'Непрозрачный случайный идентификатор серверной сессии. Cookie: HttpOnly, SameSite=Lax, Path=/,
        без Domain; Secure обязателен при HTTPS. Срок 7 суток без продления. При входе/регистрации выдаётся новая
        сессия; выход отзывает текущую и удаляет cookie. Токен не передаётся в JSON и не хранится в localStorage.
        API и сайт работают на одном origin. Для изменяющих запросов сервер отклоняет чужой Origin (или Referer
        при отсутствии Origin); при отсутствии обоих — 403. Это касается и входа/регистрации/выхода.'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    GigId:
      name: gigId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      schema:
        type: string
        enum:
        - all
        - active
        - history
        default: all
  responses:
    BadRequest:
      description: VALIDATION_ERROR — некорректный ввод.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: UNAUTHORIZED — сессия отсутствует или истекла; INVALID_CREDENTIALS — неверный email или пароль
        (одинаковый ответ для обоих случаев).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: FORBIDDEN — неверная роль, чужое действие или непрошедшая проверка Origin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: NOT_FOUND — ресурс не существует или скрыт от текущего пользователя.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: EMAIL_TAKEN, ALREADY_APPLIED или STATE_CONFLICT — дубликат либо недопустимый переход состояния.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: INTERNAL_ERROR — внутренняя ошибка без технических деталей.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
